name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web and icons
        run: |
          mkdir -p www assets
          cp index.html erfan-logo.png www/
          pip install pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open('erfan-logo.png').convert('RGB').resize((1024, 1024))
          for n in ['icon-only', 'icon-foreground', 'splash', 'splash-dark']:
              im.save('assets/' + n + '.png')
          Image.new('RGB', (1024, 1024), (0, 0, 0)).save('assets/icon-background.png')
          PY
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: ERFAN-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
